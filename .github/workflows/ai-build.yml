name: Build AI Coexist APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'app/build.gradle'
      - 'app/google-services.json'
      - 'app/src/ai/**'
      - 'app/src/main/**'
      - '.github/workflows/ai-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Remove local proxy settings (broken in CI)
        run: |
          sed -i '/systemProp.http.proxyHost/d;/systemProp.http.proxyPort/d' gradle.properties
          echo "--- gradle.properties after cleanup ---"
          cat gradle.properties

      - name: Ensure Android SDK 29 components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-29" "build-tools;29.0.3" >/dev/null 2>&1 || true
          echo "SDK ready"

      # 签名只从 GitHub Secrets 读取，仓库内不再存放 jks 与口令。
      # 若 Secrets 未配置（如 fork PR），则跳过签名（构建 unsigned，不影响开发）。
      - name: Configure release signing (from Secrets)
        env:
          LEGADO_RELEASE_KEYSTORE_BASE64: ${{ secrets.LEGADO_RELEASE_KEYSTORE_BASE64 }}
          LEGADO_RELEASE_KEY_ALIAS: ${{ secrets.LEGADO_RELEASE_KEY_ALIAS }}
          LEGADO_RELEASE_STORE_PASSWORD: ${{ secrets.LEGADO_RELEASE_STORE_PASSWORD }}
          LEGADO_RELEASE_KEY_PASSWORD: ${{ secrets.LEGADO_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$LEGADO_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$LEGADO_RELEASE_KEYSTORE_BASE64" | base64 -d > app/legado.jks
            printf '\nRELEASE_STORE_FILE=./legado.jks\nRELEASE_KEY_ALIAS=%s\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_PASSWORD=%s\n' \
              "$LEGADO_RELEASE_KEY_ALIAS" "$LEGADO_RELEASE_STORE_PASSWORD" "$LEGADO_RELEASE_KEY_PASSWORD" >> gradle.properties
          else
            echo "::warning::LEGADO_RELEASE_KEYSTORE_BASE64 未配置，本次构建为 unsigned APK"
          fi

      - name: Build AI coexist release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAiRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legado-ai-apk
          path: app/build/outputs/apk/ai/release/
          if-no-files-found: error
