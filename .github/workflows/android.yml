name: Android CI

# 推送到 master 或手动触发时，自动构建 AI 版 APK 并作为 Artifact 上传
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;29.0.3" > /dev/null

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AI flavor (unsigned release + debug)
        run: |
          ./gradlew :app:assembleAiRelease --stacktrace -x lint
          ./gradlew :app:assembleAiDebug --stacktrace -x lint

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: legado-ai-apk-release-unsigned
          path: app/build/outputs/apk/ai/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK (可直接安装)
        uses: actions/upload-artifact@v4
        with:
          name: legado-ai-apk-debug
          path: app/build/outputs/apk/ai/debug/*.apk
          if-no-files-found: error
