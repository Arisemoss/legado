# 更新 fork（手动触发）
# ⚠️ 已停用每日定时盲 merge：本仓库基线为上游 2020-08 快照并深度改造（AI 平台层），
# 与上游 gedoor/legado 差异巨大，自动合并必然产生大规模冲突/覆盖。如确需同步上游，
# 请手动运行本 workflow 或在本地分支上评估后再合并。
name: update fork

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.owner.id == github.event.sender.id && github.actor != 'gedoor' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install git
      run: |
        sudo apt-get update
        sudo apt-get -y install git
    - name: Set env
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "github-actions"
    - name: Update fork
      run: |
        git remote add upstream https://github.com/gedoor/legado.git
        git remote -v
        git fetch upstream
        git checkout master
        git merge upstream/master
        git push origin master
